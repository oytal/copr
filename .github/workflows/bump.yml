name: Track upstream releases

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install tools
        run: dnf -y install git-core rpmdevtools jq curl

      - uses: actions/checkout@v4

      - name: Bump every package with a newer upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for envfile in */package.env; do
            pkg=$(dirname "$envfile")
            spec="$pkg/$pkg.spec"
            UPSTREAM=
            TAG_PREFIX=v
            TRACK=releases
            TAG_TS_MACRO=
            ts=
            . "./$envfile"
            [ -n "$UPSTREAM" ] || { echo "$pkg: no UPSTREAM, skipping"; continue; }
            if [ "$TRACK" = tags ]; then
              # Upstream tags without GitHub releases: newest TAG_PREFIX<digits.dots> tag
              tags=$(git ls-remote --tags --refs "https://github.com/$UPSTREAM" \
                | sed -n "s|.*refs/tags/${TAG_PREFIX}||p") || true
              if [ -n "$TAG_TS_MACRO" ]; then
                # Tags are <version>-<digits> (e.g. 5.0.0-202610271435): the
                # digits can't be part of Version, so the spec keeps them in
                # the %global named TAG_TS_MACRO, which is rewritten below.
                latest=$(printf '%s\n' "$tags" \
                  | grep -E '^[0-9]+(\.[0-9]+)*-[0-9]+$' | sort -V | tail -1) || true
                ts=${latest#*-}
                latest=${latest%%-*}
              else
                latest=$(printf '%s\n' "$tags" \
                  | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1) || true
              fi
            else
              latest=$(curl -fsSL ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
                "https://api.github.com/repos/$UPSTREAM/releases/latest" | jq -r .tag_name) || true
            fi
            latest=${latest#"$TAG_PREFIX"}
            current=$(rpmspec -q --qf '%{version}\n' --srpm "$spec")
            echo "$pkg: current=$current latest=$latest"
            case "$latest" in ""|null|*-*) continue;; esac
            newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
            if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
              rpmdev-bumpspec -n "$latest" \
                -u "github-actions <github-actions@users.noreply.github.com>" \
                -c "Update to $latest" "$spec"
              if [ -n "$TAG_TS_MACRO" ]; then
                sed -i "s|^\(%global[[:space:]]\+${TAG_TS_MACRO}[[:space:]]\+\).*|\1${ts}|" "$spec"
              fi
              git commit -am "$pkg: update to $latest"
            fi
          done
          # The push fires the COPR webhooks; each project rebuilds only
          # when its own subdirectory changed.
          git push
